<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Regístrate - Software Shop</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Montserrat', sans-serif; color: #333; background: #fff; }

    .hero {
      background: linear-gradient(180deg, #322f7b 0%, #6d3db8 100%);
      color: #fff;
      padding: 70px 0 65px;
      border-top: 6px solid #fff;
      box-shadow: inset 0 6px 0 #2f2d6b;
    }
    .hero svg { width: 112px; height: auto; }
    .hero h1 { font-weight: 400; font-size: 3rem; margin: 0; line-height: 1.1; }
    .hero p  { font-weight: 300; font-size: 1.15rem; margin: 6px 0 0; color: #dcd6f5; line-height: 1.25; }

    .form-wrap { max-width: 892px; }
    .form-title { font-weight: 700; font-size: 1.25rem; text-align: center; margin: 28px 0 10px; }

    .form-control, .form-select {
      background-color: #e8e8e8;
      border: 1px solid #ccc;
      border-radius: 4px;
      height: 38px;
      font-size: .95rem;
      color: #333;
      box-shadow: none;
    }
    .form-control::placeholder { color: #999; }
    .form-control:focus, .form-select:focus {
      background-color: #efefef;
      border-color: #6d3db8;
      box-shadow: 0 0 0 .2rem rgba(109,61,184,.2);
    }
    .fields { max-width: 854px; margin: 0 auto; }

    .pregunta { color: #6c3cb7; font-weight: 600; font-size: .95rem; text-align: center; margin: 34px 0 4px; }
    .radios { display: flex; flex-direction: column; align-items: center; }
    .radios .form-check { min-width: 100px; margin: 0; font-size: .95rem; }
    .form-check-input:checked { background-color: #0dcaf0; border-color: #333; }

    .btn-registrar {
      background: #6c3cb7; color: #fff; width: 100%;
      border: 0; border-radius: 4px; height: 38px; font-weight: 300; margin-top: 20px;
    }
    .btn-registrar:hover { background: #5b30a0; color: #fff; }

    .politicas {
      border: 1px solid #ddd; border-radius: 10px; background: #fafafa;
      text-align: center; font-weight: 600; font-size: .95rem;
      padding: 4px 10px; margin: 20px 0 40px;
      box-shadow: 0 6px 12px rgba(0,0,0,.08);
    }
    .politicas a { color: #337ab7; text-decoration: none; }
    .politicas a:hover { text-decoration: underline; }
  </style>
</head>
<body>

  <!-- Encabezado -->
  <header class="hero">
    <div class="container">
      <div class="d-flex justify-content-center align-items-center gap-4 flex-wrap text-center text-md-start">
        <!-- Icono de llave -->
        <svg viewBox="0 0 112 50" fill="none" stroke="#fff" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">
          <circle cx="20" cy="26" r="16"/>
          <circle cx="20" cy="26" r="6" fill="#fff"/>
          <path d="M34 20 H108 L102 26 L96 22 L88 30 L80 22 L72 30 L64 24 L56 30 L48 26 H34"/>
        </svg>
        <div>
          <h1>Regístrate</h1>
          <p>en Software Shop y disfruta del<br>contenido que tenemos para ti.</p>
        </div>
      </div>
    </div>
  </header>

  <!-- Formulario -->
  <main class="container form-wrap">
    <h2 class="form-title">¡Registrate Rapidamente!</h2>

    <form id="registro" novalidate>
        <label for="seleccionar tipo de entidad">Selecciona el tipo de entidad</label>
      <div class="fields">
        <div class="row g-3 mb-2">
          <div class="col-md-6">
            <select class="form-select" name="tipoEntidad" required>
              <option value="" selected>Sel. Tipo Entidad</option>
              <option>Empresa privada</option>
              <option>Entidad pública</option>
              <option>Independiente</option>
              <option>Educación</option>
            </select>
          </div>
          <div class="col-md-6">
            <label for="nombre de la entidad/Empresa">Nombre de la entidad / Empresa:</label>

            <input type="text" class="form-control" name="entidad" placeholder="Abarrotes Juan" required>
          </div>
        </div>

        <div class="row g-3 mb-2">
          <div class="col-md-6">
            <label for="Nombre:">Nombre:</label>
            <input type="text" class="form-control" name="nombre" placeholder="Juan" required>
          </div>
          <div class="col-md-6">
            <label for="apellido">Apellido:</label>

            <input type="text" class="form-control" name="apellido" placeholder="Lopez" required>
          </div>
        </div>

        <div class="row g-3 mb-2">
          <div class="col-12">

            <label for="ciudad">Ciudad:</label>
            <input type="text" class="form-control" name="ciudad" placeholder="Ciudad de Mexico" required>
          </div>
        </div>

        <div class="row g-3 mb-2">
          <div class="col-md-2">
            <label for="indicativo">Indicativo:</label>
            <input type="text" class="form-control" name="indicativo" placeholder="Indicativo">
          </div>
          <div class="col-md-8">
            <label for="telefono / Celular">Telefono:</label>
            <input type="tel" class="form-control" name="telefono" placeholder="+52 123 456 78" required>
          </div>
          <div class="col-md-2">
            <label for="numero de casa ext">Numero ext. de casa:</label>
            <input type="text" class="form-control" name="ext" placeholder="123">
          </div>
        </div>

        <div class="row g-3">
          <div class="col-12">
            <label for="E-mail">E-mail:</label>
            <input type="email" class="form-control" name="email" placeholder="AbarrotesJuan@gmail.com" required>
          </div>
        </div>
      </div>

      <p class="pregunta">¿Deseas recibir correos con información de los productos del portafolio de tu interés?</p>
      <div class="radios">
        <div class="form-check">
          <input class="form-check-input" type="radio" name="correos" id="siCorreos" value="si" checked>
          <label class="form-check-label" for="siCorreos">Si, Gracias</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="correos" id="noCorreos" value="no">
          <label class="form-check-label" for="noCorreos">No, Gracias</label>
        </div>
      </div>

      <button type="submit" class="btn btn-registrar">Registrar Información</button>
    </form>

    <div class="politicas">
      Conozca nuestras políticas de tratamiento de datos <a href="#" class="text-decoration-underline" >aquí</a>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    document.getElementById('registro').addEventListener('submit', function (e) {
      e.preventDefault();
      // Aquí va el envío de datos
    });
  </script>
</body>
</html>
